# Ghost-Tag Supabase Project Configuration
# Enforces zero-knowledge encrypted vault metadata backup & edge functions.

project_id = "ghost-tag"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.anonymous_users]
enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.account-auth]
verify_jwt = true

[functions.verify-captcha]
verify_jwt = false

# --no-verify-jwt authorized ONLY because all 8 compensating controls are active and verified:
# Turnstile challenge guard, partitioned recovery_challenge/recovery_proof rate limits,
# anti-enumeration synthesis, strict schema check, generic errors, atomic replay guard, audit logs.
[functions.recover-vault]
verify_jwt = false

[functions.migrate-recovery-verifier]
verify_jwt = true

[functions.sync-vault-metadata]
verify_jwt = true

[functions.schedule-account-deletion]
verify_jwt = true

[functions.cancel-account-deletion]
verify_jwt = true

# Secured via constant-time X-Ghost-Cron-Secret check (rejects user JWTs with 403).
[functions.process-account-deletions]
verify_jwt = false
