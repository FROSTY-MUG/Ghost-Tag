name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Generate Release & Attach APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Compute Release Checksum
        run: |
          cd android/app/build/outputs/apk/release/
          cp app-release.apk ghost-tag-${{ github.ref_name }}.apk
          sha256sum ghost-tag-${{ github.ref_name }}.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Ghost-Tag ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/ghost-tag-${{ github.ref_name }}.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
