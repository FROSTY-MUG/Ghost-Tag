name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Build Signed APK & Publish Official GitHub Release
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Lint Gate
        run: npm run lint

      - name: Strict Typecheck Gate
        run: npm run typecheck

      - name: Test Suite Gate
        run: npm test -- --ci --maxWorkers=2

      - name: Enforce Release Signing Secrets Presence
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEYSTORE_PASSWORD == '' || env.ANDROID_KEY_ALIAS == '' || env.ANDROID_KEY_PASSWORD == '' }}
        run: |
          echo "::error::Mandatory release signing secrets are missing. Ghost-Tag strictly prohibits unsigned releases."
          echo "::error::Checked: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
          exit 1

      - name: Configure Production Keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK Cryptographic Signature
        run: |
          echo "Verifying production APK signature via apksigner..."
          $ANDROID_HOME/build-tools/*/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Package Release Assets & Generate Checksum
        run: |
          TAG_NAME="${{ github.ref_name }}"
          RELEASE_DIR="release_artifacts"
          mkdir -p "$RELEASE_DIR"
          
          # Copy APK and create exact naming Ghost-Tag-<version>.apk
          cp android/app/build/outputs/apk/release/app-release.apk "$RELEASE_DIR/Ghost-Tag-$TAG_NAME.apk"
          
          # Generate individual SHA-256 checksum file
          cd "$RELEASE_DIR"
          sha256sum "Ghost-Tag-$TAG_NAME.apk" > "Ghost-Tag-$TAG_NAME.apk.sha256"
          cat "Ghost-Tag-$TAG_NAME.apk.sha256"
          cd ..
          
          # Copy RELEASE-NOTES.md as a first-class release artifact
          cp RELEASE-NOTES.md "$RELEASE_DIR/RELEASE-NOTES.md"

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Ghost-Tag ${{ github.ref_name }}
          body_path: RELEASE-NOTES.md
          generate_release_notes: false
          draft: false
          prerelease: false
          files: |
            release_artifacts/Ghost-Tag-${{ github.ref_name }}.apk
            release_artifacts/Ghost-Tag-${{ github.ref_name }}.apk.sha256
            release_artifacts/RELEASE-NOTES.md
